<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Secure Ticket</title>
    <link rel="stylesheet" th:href="@{/CSS/MainPageStyle.css}">
</head>
<body>
    <div class="boleta-plataforma dark-minimal">
        <header class="header">
            <h1 class="logo">Secure Ticket</h1>
            <nav class="nav">
                <a th:href="@{/eventos}" class="nav-link">Eventos</a>
                <a th:href="@{/vender}" class="nav-link">Vender</a>
                <a th:href="@{/ayuda}" class="nav-link">Soporte</a>
            </nav>
            <div class="usuario-acciones">
                <span th:if="${session.currentUser}">
                    <span class="user-greeting" th:text="'Hola, ' + ${session.currentUser} + '!'">Hola, Usuario!</span>
                    <a th:href="@{/logout}" class="btn btn-ghost logout-btn">Cerrar Sesión</a>
                </span>
                <span th:unless="${session.currentUser}">
                    <a th:href="@{/register}" class="btn btn-ghost">Registrarse</a>
                    <a th:href="@{/login}" class="btn btn-primary">Iniciar Sesión</a>
                </span>
            </div>
        </header>
        <main class="main-contenido">
            <h2>Descubre Experiencias Inolvidables</h2>
            <section class="filtro-busqueda">
                <div class="search-box">
                    <input type="text" placeholder="Buscar conciertos, deportes, teatro..." class="search-input"/>
                    <button class="btn-icon">
                        <span role="img" aria-label="Buscar">🔍</span>
                    </button>
                </div>
                <button class="btn btn-secondary">Filtrar</button>
            </section>
            
            <div class="eventos-wrapper">
                <!-- El bucle th:each se coloca en la etiqueta <article> para generar una tarjeta por cada evento -->
                <article th:each="event : ${events}" class="tarjeta-evento dark-card">
                    
                    <!-- 1. Imagen (ahora toma el src de Cloudinary) -->
                    <img th:src="@{${event.imageUrl}}" alt="Imagen del Evento" class="imagen-evento">
                    
                    <div class="info-evento">
                        <!-- 2. Fecha -->
                        <p class="fecha" th:text="'Fecha: ' + ${event.date}"></p>
                        <!-- 3. Título/Nombre -->
                        <h3 class="titulo-evento" th:text="${event.name}"></h3>
                        <!-- 4. Lugar/Ubicación -->
                        <p class="lugar" th:text="'Lugar: ' + ${event.location}"></p>
                        <!-- 5. Artista (Sintaxis Thymeleaf corregida) -->
                        <p class="artista" th:text="'Artista: ' + ${event.artist}"></p>

                        <!-- Aquí puedes añadir un botón o enlace para ver los detalles -->
                        <a th:href="@{'/eventos/' + ${event.id}}" class="btn btn-full">Ver Detalles</a>
                    </div>
                </article>
                
                <!-- Eliminamos la línea estática de Bad Bunny que causaba conflicto y duplicidad -->
            </div>
        </main>
        <footer class="footer dark-footer">
            <a href="https://www.instagram.com" class="footer-link">Siguenos en Instagram!</a>
        </footer>
    </div>
</body>
</html>
