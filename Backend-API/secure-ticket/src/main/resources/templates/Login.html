<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Secure Ticket</title>
    
    <link rel="stylesheet" th:href="@{/css/RegisterStyle.css}">
</head>
<body>
    <div class="form-container">
        <h1>Iniciar Sesión</h1>

        <div th:if="${error}" class="message error-message">
            <p>❌ Nombre de usuario o contraseña incorrectos.</p>
        </div>

        <form th:action="@{/login}" method="post">
            
            <div class="form-group">
                <label for="username">Nombre de Usuario o Email:</label>
                <input type="text" id="username" name="username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit">Acceder</button>
            
        </form>
        
        <p class="login-link">¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a></p>
    </div>
</body>
</html>
