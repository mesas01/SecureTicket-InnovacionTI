<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro Completo</title>
    <link rel="stylesheet" th:href="@{/css/RegisterStyle.css}">
</head>
<body>
    <div class="form-container large-container">
        <h1>Registro de Nuevo Usuario</h1>

        <div th:if="${errorMessage}" class="message error-message">
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            
            <div class="form-row">
                <div class="form-group half-width">
                    <label for="name">Nombre Completo:</label>
                    <input type="text" id="name" th:field="*{name}" required>
                </div>
                <div class="form-group half-width">
                    <label for="username">Nombre de Usuario:</label>
                    <input type="text" id="username" th:field="*{username}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half-width">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" th:field="*{email}" required>
                </div>
                <div class="form-group half-width">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" th:field="*{password}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half-width">
                    <label for="idCard">Cédula / ID Card:</label>
                    <input type="text" id="idCard" th:field="*{idCard}" required>
                </div>
                <div class="form-group half-width">
                    <label for="phone">Teléfono:</label>
                    <input type="text" id="phone" th:field="*{phone}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group half-width">
                    <label for="city">Ciudad:</label>
                    <input type="text" id="city" th:field="*{city}" required>
                </div>
                <div class="form-group half-width">
                    <label for="dateOfBirth">Fecha de Nacimiento:</label>
                    <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" required>
                </div>
            </div>
            <div class="form-group">
                <label for="address">Dirección:</label>
                <input type="text" id="address" th:field="*{address}" required>
            </div>
            
            <button type="submit">Crear Cuenta</button>
            
        </form>
        
        <p class="login-link">¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión aquí</a></p>
    </div>
</body>
</html>
